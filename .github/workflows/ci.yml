name: CI

# The full suite needs the dsh runtime, which CI cannot have.
#
# `@deepseek-ai/dsh-*` is supplied by the harness itself -- locally,
# node_modules/@deepseek-ai/* are symlinks into dsh's own npx cache, not
# registry installs. The version this plugin declares (dsh-tools 0.2.0-rc.2) is
# not published at all.
#
# So CI assembles what it can and runs the tests that stay meaningful:
#
#   * the real @deepseek-ai/schemastery from npm
#   * a minimal stub for @deepseek-ai/dsh-tools (tests/stubs/dsh-tools), which
#     provides just enough for lib/index.js to load
#
# That covers the composition contract checks, the path guards and the profile
# installer -- the plugin's own logic. What it does NOT cover: argument-schema
# validation (the real defineTool does it; the stub does not) and anything in
# tests/e2e.test.mjs or tests/live-render.mjs. Run those locally:
#
#   node --test tests/e2e.test.mjs
#   node tests/live-render.mjs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20.11 is the floor: the plugin uses import.meta.dirname.
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Assemble what CI can of the dsh runtime
        run: |
          set -euo pipefail
          # --legacy-peer-deps keeps npm from trying to satisfy the plugin's
          # peerDependencies, one of which does not exist on the registry.
          npm install --no-save --no-package-lock --legacy-peer-deps \
            '@deepseek-ai/schemastery@~3.18.4'
          # The stub is placed directly rather than installed: npm treats it as
          # a peer, and --legacy-peer-deps tells npm to skip peers entirely.
          mkdir -p node_modules/@deepseek-ai
          cp -r tests/stubs/dsh-tools node_modules/@deepseek-ai/dsh-tools
          # Top-level await is a syntax error under `node -e` (CommonJS), so use
          # the promise form.
          node -e "import('@deepseek-ai/dsh-tools').then(() => console.log('runtime pieces present'))"

      - name: Tests
        run: node --test tests/plugin.test.mjs tests/install.test.mjs

      - name: CLI help exits cleanly
        run: node scripts/install.mjs --help

      - name: Unknown profile is reported, not created
        run: |
          if node scripts/install.mjs --profile no-such-profile --dry-run; then
            echo "expected a non-zero exit for an unknown profile" >&2
            exit 1
          fi

      - name: Installer is idempotent and reversible in a throwaway DSH_HOME
        run: |
          set -euo pipefail
          HOME_DIR="$(mktemp -d)"
          PROFILE="$HOME_DIR/profiles/ci"
          mkdir -p "$PROFILE"
          printf '%s\n' '{"name":"p","private":true,"dsh":{"profile":{"bundles":["@deepseek-ai/dsh-base"]}}}' > "$PROFILE/package.json"
          printf '%s\n' '# pre-existing content' > "$PROFILE/cordis.patch.yml"
          cp "$PROFILE/cordis.patch.yml" /tmp/before.yml

          DSH_HOME="$HOME_DIR" node scripts/install.mjs --profile ci
          DSH_HOME="$HOME_DIR" node scripts/install.mjs --profile ci   # must be a no-op
          DSH_HOME="$HOME_DIR" node scripts/install.mjs --profile ci --uninstall

          diff /tmp/before.yml "$PROFILE/cordis.patch.yml"
          echo "uninstall restored the original file exactly"
