name: CI

# A plain `npm install` is enough: every package the tests need is on the public
# registry, including the @deepseek-ai/* runtime, so nothing here is a stand-in.
#
# This replaces an earlier version that hand-assembled the runtime with a stub
# for @deepseek-ai/dsh-tools. That was built on a mistake worth recording: the
# pinned version (0.2.0-rc.2) looked unpublished because
# `npm view <pkg> version` prints the `latest` dist-tag, and a prerelease never
# carries it. `npm view <pkg> versions` shows it. And the real reason the first
# run failed was simpler still -- the workflow called the test runner without
# installing anything first.
#
# Not covered here: tests/live-render.mjs. It renders an actual MP4 and needs a
# Chrome headless shell, which CI has no reason to carry:
#
#   node tests/live-render.mjs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20.11 is the floor: the plugin uses import.meta.dirname.
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        # --no-package-lock: this repo is pnpm-managed, and a stray npm lockfile
        # would be noise that could disagree with pnpm-lock.yaml.
        run: npm install --no-package-lock

      - name: Tests
        run: npm test

      - name: CLI help exits cleanly
        run: node scripts/install.mjs --help

      - name: Unknown profile is reported, not created
        run: |
          if node scripts/install.mjs --profile no-such-profile --dry-run; then
            echo "expected a non-zero exit for an unknown profile" >&2
            exit 1
          fi

      - name: Installer is idempotent and reversible in a throwaway DSH_HOME
        run: |
          set -euo pipefail
          HOME_DIR="$(mktemp -d)"
          PROFILE="$HOME_DIR/profiles/ci"
          mkdir -p "$PROFILE"
          printf '%s\n' '{"name":"p","private":true,"dsh":{"profile":{"bundles":["@deepseek-ai/dsh-base"]}}}' > "$PROFILE/package.json"
          printf '%s\n' '# pre-existing content' > "$PROFILE/cordis.patch.yml"
          cp "$PROFILE/cordis.patch.yml" /tmp/before.yml

          DSH_HOME="$HOME_DIR" node scripts/install.mjs --profile ci
          DSH_HOME="$HOME_DIR" node scripts/install.mjs --profile ci   # must be a no-op
          DSH_HOME="$HOME_DIR" node scripts/install.mjs --profile ci --uninstall

          diff /tmp/before.yml "$PROFILE/cordis.patch.yml"
          echo "uninstall restored the original file exactly"
